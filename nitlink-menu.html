  <style>
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/menu/Archivo-400.ttf') format('truetype'); }
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/menu/Archivo-500.ttf') format('truetype'); }
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/menu/Archivo-600.ttf') format('truetype'); }

    :root {
      --accent: #70A4DB;
      --accent-soft: color-mix(in oklab, var(--accent) 16%, transparent);
      --accent-text: color-mix(in oklab, var(--accent) 82%, #ffffff);
      --bg: #202020;
      --chrome: #1A1A1A;
      --band: #2B2B2B;
      --hair: rgba(255, 255, 255, 0.075);
      --hair2: rgba(255, 255, 255, 0.14);
      --ink: #EDEDED;
      --ink2: #B4B4B4;
      --ink3: #8A8A8A;
      --warn: #D8B858;
      --sans: 'Archivo', 'Segoe UI', 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'Noto Sans TC', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { container: shell / inline-size; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px;
      line-height: 1.4; overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-text); }
    a:hover { color: var(--accent); }
    ::selection { background: var(--accent-soft); }
    #pane-audio input[type="number"], #audio-refresh { color:var(--ink); background:#202020; border:1px solid var(--hair2); padding:6px 8px; font:inherit; }
    #pane-audio input:focus-visible, #audio-refresh:focus-visible { outline:2px solid var(--accent); }
    #audio-refresh { cursor:pointer; transition:background-color .12s ease, border-color .12s ease, color .12s ease; }
    #audio-refresh:hover:not(:disabled), #audio-refresh:focus-visible { color:var(--accent-text); border-color:var(--accent); background:var(--accent-soft); }
    #audio-refresh[data-i18n="audio.refreshed"] { color:var(--accent-text); border-color:var(--accent); }
    #audio-refresh:active:not(:disabled) { background:var(--accent); color:var(--chrome); }
    #audio-refresh:disabled { opacity:.6; cursor:wait; }
    #pane-audio input[type="checkbox"] { accent-color:var(--accent); width:18px; height:18px; }
    #pane-audio .audio-note { font-size:12px; line-height:1.6; white-space:pre-line; overflow-wrap:anywhere; padding:8px 16px; color:var(--ink2); }
    .audio-label { display:flex; align-items:center; gap:8px; }
    .audio-help { flex:none; width:19px; height:19px; border:1px solid var(--hair2); border-radius:50%; background:none; color:var(--ink3); cursor:help; font-size:11px; }
    .audio-help:hover, .audio-help:focus-visible { color:var(--ink); border-color:var(--accent); outline:none; }
    #audio-tooltip { position:fixed; z-index:100; width:320px; max-width:calc(100vw - 24px); padding:12px 14px; border:1px solid var(--hair2); border-radius:6px; background:#303030; color:var(--ink); box-shadow:0 4px 18px #0006; font-size:12px; line-height:1.6; overflow-wrap:anywhere; }
    .rail, .metabar, #pane-video, #pane-audio, #pane-shortcuts, #pane-games {
      -webkit-user-select: none;
      user-select: none;
    }
    #game-query, #game-custom-name, #game-official-query {
      -webkit-user-select: text;
      user-select: text;
    }
    :lang(zh-CN) { --sans: "Archivo", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
    button, select { font: inherit; }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #191919; }
    ::-webkit-scrollbar-thumb { background: #4A4A4A; border: 3px solid #191919; }
    ::-webkit-scrollbar-thumb:hover { background: #5F5F5F; }

    /* Shell: left rail, then a column of top bar, signal strip, scrolling panes. */
    .app { position: fixed; inset: 0; display: flex; align-items: stretch; background: var(--bg); }

    .rail { width: 76px; flex: none; display: flex; flex-direction: column; background: var(--chrome); }
    .rail-brand { display: flex; align-items: center; justify-content: center; height: 60px; }
    .rail-brand-mark { width: 30px; height: 30px; display: block; }
    .rail-item {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; height: 60px; background: none; border: 0; cursor: pointer; color: var(--ink3);
      font-family: var(--sans); font-size: 10.5px; font-weight: 500;
      transition: background .12s ease, color .12s ease;
    }
    .rail-item:hover { background: rgba(255, 255, 255, 0.045); color: var(--ink2); }
    /* Keep WebView2's default button ring out of the UI. This shared rule
       applies to both the vertical rail and the narrow horizontal tab row. */
    .rail-item:focus { outline: none; }
    .rail-item:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -2px;
    }
    .rail-item[data-active="true"] { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .rail-item[data-active="true"]::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
    }
    .rail-status {
      margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 0 6px 14px; color: var(--ink3); font-size: 10px; text-align: center;
    }
    .rail-status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: nl-pulse 2.4s ease-in-out infinite;
    }
    @keyframes nl-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    .topbar {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 60px; padding: 0 22px; background: var(--chrome);
    }
    .topbar h1 { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
    .topbar-actions { flex: none; display: flex; align-items: center; gap: 2px; }
    .icon-btn {
      display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
      background: none; border: 0; color: var(--ink2); text-decoration: none; font-size: 12.5px;
      cursor: pointer; transition: background .12s ease, color .12s ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .icon-btn img { width: 14px; height: 14px; opacity: 0.8; }

    /* Signal strip: live values pushed from the capture pipeline. */
    .metabar {
      flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 26px;
      padding: 11px 22px; background: var(--chrome); border-top: 1px solid var(--hair);
    }
    .meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .meta-label { color: var(--ink3); font-size: 12px; }
    .meta-value { color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
    #source-trigger { position: relative; flex: none; cursor: pointer; }
    #hdmi-source-picker { flex: none; }
    #meta-source { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    .chevron { flex: none; color: var(--ink2); }

    main { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); }
    .pane { display: none; max-width: 924px; padding: 18px 0 30px; }
    .pane[data-active="true"] { display: block; }
    .settings-group { display: contents; }

    .band {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 34px; padding: 0 22px; background: var(--band);
    }
    .band-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink2);
    }
    .band-hint { color: var(--ink3); font-size: 11.5px; }
    .advanced[hidden] { display: none; }
    .advanced > summary { cursor: pointer; list-style: none; }
    .advanced > summary::-webkit-details-marker { display: none; }
    .advanced > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .advanced[open] > summary .chevron { transform: rotate(90deg); }

    .row {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 240px); align-items: center; gap: 16px;
      min-height: 46px; padding: 8px 22px; border-bottom: 1px solid var(--hair);
      transition: background .1s ease;
    }
    .row[hidden] { display: none !important; }
    .row[data-action] { cursor: pointer; }
    .row[data-action]:hover { background: rgba(255, 255, 255, 0.035); }
    .row-name { min-width: 0; color: var(--ink2); font-size: 13px; overflow-wrap: anywhere; }
    .row-right { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row-right.end { justify-content: flex-end; }
    .row-chip { color: var(--ink3); font-size: 12px; }
    .row-value { min-width: 0; color: var(--ink); font-size: 13px; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
    .no-signal-image-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .no-signal-choose { flex: none; }
    .no-signal-action {
      flex: none; border: 0; background: none; padding: 0; color: var(--accent-text);
      cursor: pointer; font: inherit; font-weight: 500;
    }
    .no-signal-action:hover { color: var(--accent); }
    .no-signal-remove:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    .row.kv { min-height: 42px; }

    .notice {
      display: flex; gap: 10px; padding: 10px 22px; border-bottom: 1px solid var(--hair);
      background: rgba(214, 178, 74, 0.08); color: var(--ink2); font-size: 12px; line-height: 1.45;
    }
    .notice[hidden] { display: none !important; }
    .notice-tag { flex: none; color: var(--warn); font-weight: 600; }

    .toggle {
      position: relative; width: 36px; height: 18px; flex: none; border-radius: 9px;
      background: #4A4A4A; transition: background .15s ease;
    }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
      background: #D0D0D0; transition: transform .16s ease, background .16s ease;
    }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(18px); background: #1B1B1B; }

    .slider-wrap { display: flex; align-items: center; gap: 14px; }
    .slider { position: relative; flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; }
    .slider-track { position: absolute; left: 0; right: 0; height: 3px; background: #4A4A4A; }
    .slider-fill { position: absolute; left: 0; height: 3px; background: var(--accent); }
    .slider-thumb {
      position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); transform: translate(-50%, -50%);
    }
    .slider-val { width: 30px; text-align: right; color: var(--ink); font-size: 13px; font-weight: 500; }
    .slider[type="range"] { min-width: 0; width: 100%; margin: 0; accent-color: var(--accent); }
    #slider-pip-opacity-val { width: 42px; }

    .about-hero { padding: 18px 22px 14px; border-bottom: 1px solid var(--hair); }
    .about-hero h2 { color: var(--ink); font-size: 19px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    .about-hero p { margin-top: 3px; color: var(--ink3); font-size: 12px; line-height: 1.55; }
    .about-update { border-bottom: 1px solid var(--hair); }
    .about-update-heading { min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 22px; background: var(--band); }
    .about-update-heading h3 { color: var(--ink2); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .about-check-button { flex: none; border: 1px solid var(--hair2); padding: 6px 10px; background: #202020; color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
    .about-check-button:hover:not(:disabled), .about-check-button:focus-visible { border-color: var(--accent); color: var(--accent-text); }
    .about-check-button:focus-visible, .about-details > summary:focus-visible, .about-links a:focus-visible,
    .about-source-links a:focus-visible, .about-contributor a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .about-check-button:disabled { opacity: .55; cursor: wait; }
    .about-update-state { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; padding: 11px 22px 6px; }
    .about-update-status { min-width: 0; flex: 1 1 190px; color: var(--ink2); font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
    .about-update-status[hidden], .about-release-link[hidden] { display: none; }
    .about-auto-check { min-width: 116px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 9px; color: var(--ink2); font-size: 12px; cursor: pointer; }
    .about-auto-check .toggle { border: 0; }
    .about-auto-check .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .about-release-row { padding: 0 22px 6px; }
    .about-release-link { display: inline-block; color: var(--accent-text); font-size: 12px; font-weight: 500; line-height: 1.5; }
    .about-last-check { padding: 0 22px 6px; color: var(--ink3); font-size: 11.5px; line-height: 1.55; overflow-wrap: anywhere; }
    .about-update-note { padding: 0 22px 12px; color: var(--ink3); font-size: 11.5px; line-height: 1.55; }
    .about-links { display: flex; flex-wrap: wrap; gap: 18px; padding: 12px 22px; border-bottom: 1px solid var(--hair); }
    .about-links a, .about-source-links a { font-size: 12.5px; font-weight: 500; }
    .about-details { border-bottom: 1px solid var(--hair); }
    #about-contributors { border-bottom: 0; }
    .about-details > summary { min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 22px; color: var(--ink2); background: var(--band); font-size: 12px; font-weight: 600; cursor: pointer; list-style: none; }
    .about-details > summary::-webkit-details-marker { display: none; }
    .about-details > summary::after { content: '▾'; color: var(--ink3); transition: transform .12s ease; }
    .about-details[open] > summary::after { transform: rotate(180deg); }
    .about-details-body { padding: 12px 22px 18px; }
    .about-details-body > p { margin-top: 10px; color: var(--ink2); font-size: 12px; line-height: 1.6; text-wrap: pretty; }
    .about-details-body > p:first-child { margin-top: 0; }
    .about-source-links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; }
    .about-contributors { color: var(--ink2); font-size: 12px; line-height: 1.55; }
    .about-contributor { margin-top: 4px; }
    .about-contributor a { display: inline; color: var(--accent-text); font-weight: 500; text-decoration: none; transition: color .12s ease; }
    .about-contributor-name { text-decoration: underline; }
    .about-contributor-logo { display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px; fill: var(--ink2); transition: fill .12s ease; }
    .about-contributor a:hover { color: var(--accent); }
    .about-contributor a:hover .about-contributor-logo, .about-contributor a:focus-visible .about-contributor-logo { fill: var(--accent-text); }

    #contributor-preview { position: fixed; z-index: 110; width: 360px; max-width: calc(100vw - 24px); border: 1px solid var(--hair2); border-radius: 8px; background: #373737; color: var(--ink); box-shadow: 0 8px 28px #0008; overflow: hidden; }
    #contributor-preview[hidden] { display: none; }
    .contributor-preview-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--hair); color: var(--ink2); font-size: 12px; }
    .contributor-preview-site { display: inline-flex; align-items: center; gap: 9px; }
    .contributor-preview-site svg { width: 15px; height: 15px; fill: currentColor; }
    .contributor-preview-open { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-weight: 500; text-decoration: none; }
    .contributor-preview-open:hover { color: var(--accent-text); }
    .contributor-preview-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .contributor-preview-open svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .contributor-preview-body { display: flex; align-items: flex-start; gap: 12px; padding: 14px; }
    .contributor-preview-avatar { flex: none; width: 80px; height: 80px; border-radius: 5px; overflow: hidden; background: var(--accent-soft); }
    .contributor-preview-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .contributor-preview-avatar img[hidden], .contributor-preview-avatar span[hidden] { display: none; }
    .contributor-preview-avatar span { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--accent-text); font-size: 24px; font-weight: 600; }
    .contributor-preview-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #contributor-preview-title { font-size: 13px; font-weight: 600; line-height: 1.5; }
    #contributor-preview-handle { margin-top: 2px; color: var(--ink2); font-size: 12px; }
    .contributor-preview-description { margin-top: 7px; color: var(--ink2); font-size: 12px; line-height: 1.5; }

    /* Source picker: HDMI identity, device list and capture-format cascade. */
    .source-popover {
      position: absolute; top: calc(100% + 2px); left: 0; z-index: 30; width: 320px; display: none;
      flex-direction: column; max-height: 340px; overflow-y: auto; padding: 4px 0;
      border: 1px solid var(--hair2); background: #2C2C2C; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }
    .source-popover[data-open="true"] { display: flex; }
    .source-popover-section-label {
      padding: 9px 14px 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink3);
    }
    .source-popover-item, .source-popover-action {
      display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 6px 14px;
      color: var(--ink2); cursor: pointer; transition: background .1s ease, color .1s ease;
    }
    .source-popover-item:hover, .source-popover-action:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .source-popover-item[data-active="true"] { color: var(--ink); }
    .source-popover-bullet { width: 6px; height: 6px; border-radius: 50%; flex: none; background: #5F5F5F; }
    .source-popover-item[data-active="true"] .source-popover-bullet { background: var(--accent); }
    #hdmi-source-custom-editor { display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; }
    #hdmi-source-custom-editor[hidden] { display: none; }
    #hdmi-source-custom-editor label { color: var(--ink2); font-size: 12px; }
    #hdmi-source-custom-input {
      width: 100%; min-width: 0; padding: 7px 8px; color: var(--ink); background: #202020;
      border: 1px solid var(--hair2); border-radius: 0; font: 12.5px var(--sans); outline: none;
    }
    #hdmi-source-custom-input:focus { border-color: var(--accent); }
    .hdmi-source-custom-actions { display: flex; gap: 10px; }
    .hdmi-source-custom-actions button {
      padding: 6px 10px; color: var(--ink); background: #202020; border: 1px solid var(--hair2);
      font: 12px var(--sans); cursor: pointer;
    }
    .hdmi-source-custom-actions button:hover { border-color: var(--accent); }
    #hdmi-source-custom-error { color: var(--warn); font-size: 11px; line-height: 1.5; }
    .source-popover-name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px;
    }
    .source-popover-divider { height: 1px; background: var(--hair); margin: 5px 0; }
    .source-popover-action { justify-content: flex-start; font-size: 12px; font-weight: 500; }
    .source-popover-select-row {
      display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; padding: 4px 14px;
    }
    .source-popover-select-row label { font-size: 12px; color: var(--ink3); }
    .source-popover-select {
      width: 100%; min-width: 0; color: var(--ink); background: #202020; border: 1px solid var(--hair2);
      border-radius: 0; padding: 6px 8px; font-family: var(--sans); font-size: 12px; outline: none;
      cursor: pointer; transition: border-color .12s ease;
    }
    .source-popover-select:hover { border-color: #6E6E6E; }
    .source-popover-select:focus { border-color: var(--accent); }
    .source-popover-select:disabled { opacity: 0.45; cursor: not-allowed; }
    .source-popover-select:disabled:hover { border-color: var(--hair2); }
    #hdmi-source-custom-row[hidden] { display: none; }
    #hdmi-source-custom-edit { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-select {
      min-width: 0; max-width: 180px; color: var(--ink); background: #202020;
      border: 1px solid var(--hair2); border-radius: 0; padding: 6px 8px;
      font-family: var(--sans); font-size: 12px; outline: none; cursor: pointer;
    }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-10px);
      max-width: min(560px, calc(100vw - 32px)); padding: 11px 14px; border: 1px solid var(--hair2);
      background: #2C2C2C; color: var(--ink); font-size: 12.5px; z-index: 100; opacity: 0;
      pointer-events: none; transition: opacity .18s ease, transform .18s ease;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }
    .toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    /* Drawer layout. The host docks this page as a strip beside the picture
       (panel_side right or left, about 420 CSS px wide): the rail becomes a
       tab strip, the signal block stacks, and the surfaces go translucent so
       the picture reads through. The full-window panel keeps the wide layout. */
    @container shell (max-width: 640px) {
      :root {
        --bg: rgba(26, 26, 26, 0.93);
        --chrome: rgba(18, 18, 18, 0.94);
        --band: rgba(44, 44, 44, 0.88);
      }
      body { background: transparent; }
      .app { flex-direction: column; box-shadow: 0 0 40px rgba(0, 0, 0, 0.55); }
      html[data-side="right"] .app { border-left: 1px solid var(--hair2); }
      html[data-side="left"] .app { border-right: 1px solid var(--hair2); }
      .rail { width: auto; height: 48px; flex-direction: row; align-items: stretch; border-bottom: 1px solid var(--hair); }
      .rail-brand { height: auto; padding: 0 10px 0 16px; }
      .rail-brand-mark { width: 24px; height: 24px; }
      .rail-item { flex: 1; flex-direction: row; gap: 7px; height: auto; font-size: 12px; }
      .rail-item svg { width: 15px; height: 15px; }
      .rail-item[data-active="true"]::before { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 2px; }
      .rail-status { display: none; }
      .topbar { display: none; }
      .metabar {
        display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; padding: 12px 16px;
        border-top: 0; border-bottom: 1px solid var(--hair);
      }
      .meta { flex-direction: column; align-items: flex-start; gap: 2px; }
      #source-trigger { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 8px; }
      #meta-source { max-width: none; }
      .pane { max-width: none; padding: 10px 0 0; }
      .band { height: 32px; padding: 0 16px; }
      .row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 16px; }
      #no-signal-image-row { grid-template-columns: max-content minmax(0, 1fr); }
      #no-signal-image-row .row-name { white-space: nowrap; }
      .row-chip { display: none; }
      .row-right { justify-content: flex-end; }
      .row:has(.slider-wrap) { grid-template-columns: 1fr; gap: 6px; }
      .about-hero { padding: 14px 16px 12px; }
      .about-hero h2 { font-size: 17px; }
      .about-update-heading { padding: 6px 16px; }
      .about-update-state { align-items: flex-start; padding: 10px 16px 5px; }
      .about-auto-check { min-width: auto; }
      .about-release-row { padding: 0 16px 5px; }
      .about-last-check { padding: 0 16px 5px; }
      .about-update-note { padding: 0 16px 10px; }
      .about-links { gap: 12px 18px; padding: 11px 16px; }
      .about-details > summary { padding: 10px 16px; }
      .about-details-body { padding: 11px 16px 16px; }
      .toast { max-width: calc(100vw - 24px); }
    }

    /* Full uses the existing state, navigation and controls. Only this mode
       gets a signal sidebar and section columns; docked rules stay intact. */
    @container shell (min-width: 960px) {
      html[data-side="full"] .content {
        display: grid;
        grid-template-columns: clamp(240px, 20vw, 320px) minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas: "warning warning" "header header" "signal settings";
      }
      html[data-side="full"] #config-warning { grid-area: warning; }
      html[data-side="full"] .topbar { grid-area: header; }
      html[data-side="full"] .metabar {
        grid-area: signal; flex-direction: column; align-items: stretch; gap: 22px;
        padding: 24px 22px; border-right: 1px solid var(--hair);
      }
      html[data-side="full"] .meta { flex-direction: column; align-items: flex-start; gap: 6px; }
      html[data-side="full"] .meta-value { white-space: normal; overflow-wrap: anywhere; }
      html[data-side="full"] #source-trigger {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 8px;
      }
      html[data-side="full"] #source-trigger > .meta-label { grid-column: 1 / -1; }
      html[data-side="full"] #meta-source { max-width: none; }
      html[data-side="full"] main { grid-area: settings; min-width: 0; }
      html[data-side="full"] .pane { max-width: none; padding: 22px 22px 30px; }
      html[data-side="full"] #pane-video[data-active="true"] {
        display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 22px;
      }
      html[data-side="full"] .settings-group { display: block; min-width: 0; }
      html[data-side="full"] .advanced { grid-column: 1 / -1; }
      html[data-side="full"] .row-right { justify-content: flex-end; gap: 12px; }
      html[data-side="full"] .row-chip { text-align: right; }
    }
    @container shell (min-width: 1280px) {
      html[data-side="full"] #pane-video[data-active="true"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    html[data-active-pane="pane-about"] .metabar { display: none !important; }
    @container shell (min-width: 960px) {
      html[data-side="full"][data-active-pane="pane-about"] .content {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "warning" "header" "settings";
      }
      html[data-side="full"][data-active-pane="pane-about"] #pane-about {
        width: 100%; max-width: 1180px; margin: 0 auto; padding-top: 22px;
      }
    }
    /* Game management is independent of capture settings. Layout follows the
       actual content width, including a 420px dock or a small Full window. */
    #pane-games { container: games / inline-size; min-width: 0; }

    .game-panel h2 { font-size: 13px; font-weight: 600; }

    .game-eyebrow { color: var(--accent-text); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .game-current { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
    .game-current-title { margin: 5px 0; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    .game-art { position: relative; aspect-ratio: 1; background: #181d24; border-radius: 5px; overflow: hidden; display: grid; place-items: center; color: #65778d; }
    .game-art::before { content: '◇'; font-size: 30px; }
    .game-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .game-art[data-image-state="loading"] { animation: game-shimmer 1.4s ease-in-out infinite alternate; }
    .game-art[data-image-state="failed"]::before { content: '!'; font-size: 22px; }
    @keyframes game-shimmer { to { background: #303b49; } }
    .game-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .game-source-guidance { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; margin:0 0 14px; border:1px solid rgba(110,177,246,.4); border-radius:6px; background:rgba(110,177,246,.06); }
    .game-source-guidance > div { min-width:0; }

    #game-official-query { flex: 1; width: 0; min-width: 0; padding: 9px; border: 1px solid var(--hair2); border-radius: 5px; background: #1c1c1c; color: var(--ink); font: inherit; }

    #game-query { flex: 1; width: 0; min-width: 0; padding: 10px 12px; border: 1px solid var(--hair2); border-radius: 5px; color: var(--ink); background: #1c1c1c; font: 13px var(--sans); }

    .game-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; max-height: 390px; overflow-y: auto; padding: 2px 6px 2px 2px; scrollbar-gutter: stable; }
    .game-result { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; min-width: 0; text-align: left; border: 1px solid var(--hair2); border-radius: 6px; background: #202020; padding: 8px; color: var(--ink); cursor: pointer; }

    .game-result .game-art:not([data-image-state="ok"])::before { content: attr(data-image-label); font-size: 11px; line-height: 1.6; padding: 12px; text-align: center; color: var(--ink3); }
    .game-result-title { display: block; margin: 8px 0 4px; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .game-result-subtitle { display: block; font-size: 10px; color: var(--ink3); overflow-wrap: anywhere; }
    .game-result-origin { display: inline-block; align-self: flex-start; margin-top: 7px; font-size: 9px; padding: 2px 5px; border-radius: 3px; color: var(--accent-text); background: var(--accent-soft); }
    .game-result-wrap { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .game-result-wrap .game-result { width: 100%; flex: none; }
    .game-favorite-action { width: 100%; text-align: center; font-size: 10px; }
    .game-my-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(145px,1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px 5px 2px 2px; }
    .game-my-card { min-width: 0; padding: 8px; border: 1px solid var(--hair2); border-radius: 6px; background: #202020; }
    .game-my-card[data-current="true"] { border-color: var(--accent); background: #27313d; }
    .game-my-select { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .game-my-title { display: block; padding: 7px 0 3px; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .game-my-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .game-my-tools .game-button { font-size: 10px; padding: 5px 7px; }
    .game-recent-heading { margin: 14px 0 8px; font-size: 12px; color: var(--ink2); }
    .game-recent-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
    .game-recent-select { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 8px; align-items: center; text-align: left; }
    .game-recent-select span { overflow-wrap: anywhere; }
    .game-rename { margin-top: 12px; padding: 10px; background: #1c1c1c; border: 1px solid var(--hair2); border-radius: 5px; }
    .game-rename input { width: 100%; margin-top: 7px; padding: 8px; color: var(--ink); border: 1px solid var(--hair2); background: #202020; font: inherit; }
    .game-pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
    .game-gallery[data-shape="all"] img { object-fit: contain; }
    .game-query-trace { margin: 10px 0; font-size: 10px; line-height: 1.6; color: var(--ink3); overflow-wrap: anywhere; }
    #game-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    #game-suggestions .game-button { font-size: 10px; text-align: left; overflow-wrap: anywhere; }
    .game-empty { padding: 24px 12px; text-align: center; border: 1px dashed var(--hair2); border-radius: 6px; color: var(--ink3); font-size: 12px; line-height: 1.7; }
    .game-fallback { padding: 12px; margin-top: 12px; background: #2b2a24; border-radius: 6px; }
    .game-fallback .game-actions { margin-top: 8px; }
    .game-cover-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .game-gallery { container: cover-gallery / inline-size; display: grid; grid-template-columns: repeat(auto-fill, minmax(max(64px, calc((100% - 40px) / 6)), 1fr)); gap: 8px; max-height: 420px; overflow-y: auto; padding: 2px 6px 2px 2px; scrollbar-gutter: stable; }
    .game-cover-tile { position: relative; min-width: 0; align-self: start; }
    @container cover-gallery (min-width: 144px) {
      .game-cover-tile[data-official="true"] { grid-column: span 2; }
    }
    .game-cover-tile .game-cover { display: block; width: 100%; padding: 2px; }
    .game-cover-tile .game-art img { object-fit: contain; }
    .game-cover-meta { display: grid; grid-template-columns: auto minmax(0,1fr) 23px; grid-template-rows: minmax(23px,auto); align-items: start; gap: 4px; min-width: 0; margin-top: 5px; }
    .game-cover-info { grid-column: 3; grid-row: 1; width: 23px; height: 23px; border: 1px solid #8295a8; border-radius: 50%; background: #171c24ee; color: #fff; font: 13px var(--sans); cursor: pointer; }
    .game-cover-badge { position: absolute; left: 5px; top: 5px; padding: 3px 4px; border-radius: 3px; background: #152c40ee; color: #b9e0ff; font-size: 9px; pointer-events: none; }
    .game-cover-badge.logo { position: static; grid-column: 1; grid-row: 1; align-self: start; white-space: nowrap; }
    .game-artwork-heading { margin: 14px 0 9px; color: var(--ink2); font-size: 12px; font-weight: 500; }

    .game-editor-previews { display: flex; align-items: center; gap: 24px; margin: 16px 0; }

    .game-cover { min-width: 0; position: relative; background: #202020; border: 2px solid transparent; border-radius: 7px; padding: 4px; color: var(--ink2); cursor: pointer; text-align: left; }

  <div class="app">
