name: HolyBear Windows Release

on:
  push:
    branches: [holybear/integrated]
    tags: ['v*-holybear*']
  workflow_dispatch:
    inputs:
      signing_validation:
        description: 'Sign and verify only; never create or publish a Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: holy-bear-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'HolyBearTW/nitlink'
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.operation.outputs.tag }}
      release: ${{ steps.operation.outputs.release }}
      validate: ${{ steps.operation.outputs.validate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select build, signing validation or formal release
        id: operation
        shell: pwsh
        env:
          SIGNING_VALIDATION: ${{ inputs.signing_validation }}
        run: |
          . ./scripts/holy-bear-common.ps1
          $info = Get-HolyBearVersion
          $manual = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'
          if ($manual -and $env:GITHUB_REF -cne 'refs/heads/holybear/integrated') {
            throw 'Manual runs require holybear/integrated; tags and other branches are forbidden.'
          }
          $tagPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF.StartsWith('refs/tags/')
          $release = $tagPush -and $env:GITHUB_REF -ceq "refs/tags/$($info.Tag)"
          $validate = $manual -and $env:SIGNING_VALIDATION -eq 'true'
          if ($tagPush -and -not $release) { throw 'Only the matching formal HolyBear version tag may trigger a release; validation tags are forbidden.' }
          "tag=$($info.Tag)" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "validate=$($validate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Ensure WebView2 Runtime on the CI runner
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client")
          $installed = $keys | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (-not $installed) {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Untrusted WebView2 installer' }
            $process = Start-Process -FilePath $setup -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - name: Build x64 Release and run complete CTest
        shell: pwsh
        run: ./scripts/build-holybear.ps1
      - name: Package and verify fresh portable ZIP and branded Setup
        shell: pwsh
        run: |
          if ('${{ steps.operation.outputs.release }}' -eq 'true') {
            ./scripts/package-holybear.ps1 -Tag $env:GITHUB_REF_NAME -RequireTag
          } else {
            ./scripts/package-holybear.ps1
          }
      - name: Verify install, upgrade and uninstall on the disposable CI runner
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Assets build/holy-bear-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holy-bear-portable
          path: |
            build/holy-bear-dist/*.zip
            build/holy-bear-dist/*Setup-x64.exe
            build/holy-bear-dist/SHA256SUMS.txt
            build/holy-bear-dist/RELEASE-NOTES.md
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: holy-bear-validation
          path: |
            build/holy-bear/ctest-results.xml
            build/holy-bear/ctest-output.log
            build/holy-bear/test-summary.json
          if-no-files-found: warn

  sign:
    name: Protected signing, verification and optional publication
    if: github.repository == 'HolyBearTW/nitlink' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/holybear/integrated' && needs.build.outputs.validate == 'true'))
    needs: build
    environment: release
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a trusted source and locate GPG
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          . ./scripts/holy-bear-common.ps1
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -ceq "refs/tags/$($env:RELEASE_TAG)") {
            $commit = & git rev-parse "$($env:GITHUB_REF)^{commit}"
            if ($LASTEXITCODE -ne 0 -or $commit -ne (Get-HolyBearCommit)) { throw 'Source tag mismatch.' }
          } elseif ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -cne 'refs/heads/holybear/integrated') {
            throw 'Signing requires a formal tag push or a manual run on holybear/integrated.'
          }
          & git merge-base --is-ancestor HEAD origin/holybear/integrated
          if ($LASTEXITCODE -ne 0) { throw 'Source is outside the reviewed integration branch.' }
          if (-not (Get-Command gpg -ErrorAction SilentlyContinue)) {
            $tools = Join-Path $env:ProgramFiles 'Git/usr/bin'
            if (-not (Test-Path -LiteralPath (Join-Path $tools 'gpg.exe'))) { throw 'GPG tools missing.' }
            "$tools" >> $env:GITHUB_PATH
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: holy-bear-portable
          path: release-assets
      - name: Unlock the selected subkey, sign and verify all three final files
        shell: pwsh
        env:
          HOLYBEAR_GPG_PRIVATE_KEY: ${{ secrets.HOLYBEAR_GPG_PRIVATE_KEY }}
          HOLYBEAR_GPG_PASSPHRASE: ${{ secrets.HOLYBEAR_GPG_PASSPHRASE }}
          HOLYBEAR_GPG_FINGERPRINT: ${{ secrets.HOLYBEAR_GPG_FINGERPRINT }}
          HOLYBEAR_SIGNING_ENVIRONMENT: release
          SIGNING_VALIDATION: ${{ needs.build.outputs.validate }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $options = @('scripts/release-signing.py', 'sign', '--assets', 'release-assets', '--tag', $env:RELEASE_TAG)
          if ($env:SIGNING_VALIDATION -eq 'true') { $options += '--validation-only' }
          & python @options
          if ($LASTEXITCODE -ne 0) { throw 'GPG unlock, signature or hash verification failed; publication blocked.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holy-bear-signed
          path: |
            release-assets/*.zip
            release-assets/*Setup-x64.exe
            release-assets/*.asc
            release-assets/SHA256SUMS.txt
            release-assets/RELEASE-NOTES.md
            release-assets/SIGNING-VERIFICATION.txt
          if-no-files-found: error
      - name: Verify uploaded draft assets and publish official Latest Release
        if: needs.build.outputs.release == 'true' && needs.build.outputs.validate != 'true' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-holybear.ps1 -Tag $env:GITHUB_REF_NAME -Assets release-assets
